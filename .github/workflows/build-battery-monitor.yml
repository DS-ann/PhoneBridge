name: Build Battery Monitor

on:
  push:
    branches: [ battery-monitor ]
    paths:
      - 'battery-monitor/**'
      - '.github/workflows/build-battery-monitor.yml'
  pull_request:
    branches: [ battery-monitor ]
    paths:
      - 'battery-monitor/**'
      - '.github/workflows/build-battery-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Battery Monitor APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: battery-monitor
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare and validate BatteryPulse release signing
        env:
          BATTERYPULSE_KEYSTORE_BASE64: ${{ secrets.BATTERYPULSE_KEYSTORE_BASE64 }}
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$BATTERYPULSE_KEYSTORE_BASE64" ] || [ -z "$BATTERYPULSE_STORE_PASSWORD" ] || [ -z "$BATTERYPULSE_KEY_ALIAS" ]; then
            echo "BatteryPulse signing secrets are incomplete." >&2
            exit 1
          fi
          printf '%s' "$BATTERYPULSE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/batterypulse-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/batterypulse-release.p12" -storepass "$BATTERYPULSE_STORE_PASSWORD" -alias "$BATTERYPULSE_KEY_ALIAS" >/dev/null
          chmod 600 "$RUNNER_TEMP/batterypulse-release.p12"
          echo "BatteryPulse PKCS12 keystore validated."

      - name: Build release APK
        working-directory: battery-monitor
        env:
          BATTERYPULSE_KEYSTORE_PATH: ${{ runner.temp }}/batterypulse-release.p12
          BATTERYPULSE_STORE_PASSWORD: ${{ secrets.BATTERYPULSE_STORE_PASSWORD }}
          BATTERYPULSE_KEY_ALIAS: ${{ secrets.BATTERYPULSE_KEY_ALIAS }}
          BATTERYPULSE_KEY_PASSWORD: ${{ secrets.BATTERYPULSE_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-debug
          path: battery-monitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-release
          path: battery-monitor/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
