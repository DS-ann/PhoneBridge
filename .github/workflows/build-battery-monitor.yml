name: Build Battery Monitor

on:
  push:
    branches: [ battery-monitor ]
    paths:
      - 'battery-monitor/**'
      - '.github/workflows/build-battery-monitor.yml'
  pull_request:
    branches: [ battery-monitor ]
    paths:
      - 'battery-monitor/**'
      - '.github/workflows/build-battery-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Battery Monitor APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: battery-monitor
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        working-directory: battery-monitor
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-debug
          path: battery-monitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-monitor-release
          path: battery-monitor/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
