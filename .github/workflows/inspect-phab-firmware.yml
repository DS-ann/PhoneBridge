name: Inspect Phab firmware audio configuration

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to the firmware ZIP'
        required: true
        type: string
        default: 'https://archive.org/download/PB2670MS000050171016ROW/PB2-670M_S000050_171016_ROW.zip'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download firmware
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
        run: |
          set -euo pipefail
          mkdir -p work extracted report
          curl -L --fail --retry 3 --retry-all-errors -o work/firmware.zip "$FIRMWARE_URL"
          ls -lh work/firmware.zip

      - name: Extract firmware package
        run: |
          set -euo pipefail
          7z x -y work/firmware.zip -owork/package >/dev/null
          find work/package -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | tee report/package-files.txt

      - name: Locate signed system image
        run: |
          set -euo pipefail
          SYSTEM_IMG="$(find work/package -type f \( -iname 'system-sign.img' -o -iname 'system.img' \) -print -quit)"
          if [ -z "$SYSTEM_IMG" ]; then
            echo 'No system-sign.img or system.img found' >&2
            exit 1
          fi
          echo "Using system image: $SYSTEM_IMG" | tee report/system-image.txt
          cp "$SYSTEM_IMG" work/system.img
          ls -lh work/system.img

      - name: Identify image format
        run: |
          set -euo pipefail
          file work/system.img | tee report/image-file.txt
          xxd -l 512 work/system.img | tee report/image-header.txt
          echo '--- signatures ---' | tee -a report/image-file.txt
          binwalk work/system.img 2>&1 | tee report/binwalk.txt || true

      - name: Convert sparse image and locate real EXT4 start
        run: |
          set -euo pipefail
          if simg2img work/system.img work/system-unsparse.img 2>report/simg2img.err; then
            echo 'Android sparse image converted.' | tee report/unsparse.txt
            IMG=work/system-unsparse.img
          else
            echo 'Not an Android sparse image; using original image.' | tee report/unsparse.txt
            IMG=work/system.img
          fi
          # EXT4: filesystem start + 1024 = superblock; magic 0xEF53 is +0x38 in superblock.
          python3 - "$IMG" <<'PY'
          import sys
          p=sys.argv[1]; magic=b'\x53\xef'; hits=[]
          with open(p,'rb') as f:
              pos=0; chunk_size=64*1024*1024; overlap=4096; previous=b''
              while True:
                  chunk=f.read(chunk_size)
                  if not chunk: break
                  data=previous+chunk; base=pos-len(previous); start=0
                  while True:
                      i=data.find(magic,start)
                      if i < 0: break
                      magic_offset=base+i
                      fs_offset=magic_offset-0x38-1024
                      if fs_offset >= 0 and fs_offset % 1024 == 0:
                          hits.append((fs_offset,magic_offset))
                      start=i+1
                  pos += len(chunk); previous=chunk[-overlap:]
          seen=set(); unique=[]
          for h in hits:
              if h[0] not in seen: seen.add(h[0]); unique.append(h)
          print('EXT4 candidate filesystem offsets:', [x[0] for x in unique[:50]])
          with open('report/ext4-offsets.txt','w') as out:
              for fs_offset,magic_offset in unique:
                  out.write(f'filesystem_offset={fs_offset} magic_offset={magic_offset}\n')
          if unique: open('work/ext4-offset','w').write(str(unique[0][0]))
          PY
          OFFSET=0
          [ -s work/ext4-offset ] && OFFSET=$(cat work/ext4-offset)
          echo "Filesystem offset: $OFFSET" | tee report/filesystem-offset.txt
          if [ "$OFFSET" = 0 ]; then cp "$IMG" work/system-ext4.img; else tail -c +$((OFFSET+1)) "$IMG" > work/system-ext4.img; fi
          file work/system-ext4.img | tee report/ext4-file.txt

      - name: Inspect filesystem
        run: |
          set -euo pipefail
          mkdir -p extracted
          if ! e2fsck -fn work/system-ext4.img >report/e2fsck.txt 2>&1; then
            echo 'EXT4 validation failed; filesystem extraction will be skipped.' | tee report/e2fsck-status.txt
            cat report/e2fsck.txt
            exit 0
          fi
          dumpe2fs -h work/system-ext4.img 2>&1 | tee report/ext4-header.txt || true
          debugfs -R 'ls -p /etc' work/system-ext4.img 2>&1 | tee report/etc-list.txt || true
          debugfs -R 'ls -p /lib/hw' work/system-ext4.img 2>&1 | tee report/lib-hw-list.txt || true
          debugfs -R 'ls -p /lib64/hw' work/system-ext4.img 2>&1 | tee report/lib64-hw-list.txt || true

      - name: Extract audio configuration files
        run: |
          set -euo pipefail
          mkdir -p extracted/etc extracted/lib/hw extracted/lib64/hw
          if [ ! -s report/e2fsck.txt ] || ! grep -q 'clean' report/e2fsck.txt; then
            echo 'Skipping file extraction because EXT4 validation did not succeed.' | tee report/extraction-skipped.txt
            exit 0
          fi
          extract_if_present() {
            src="$1"; dst="$2"
            if debugfs -R "stat $src" work/system-ext4.img 2>/dev/null | grep -q 'Inode:'; then
              echo "Extracting $src"
              debugfs -R "dump $src $dst" work/system-ext4.img >/dev/null 2>&1 || true
            fi
          }
          for f in /etc/audio_policy.conf /etc/audio_policy_configuration.xml /etc/audio_policy_volumes.xml /etc/mixer_paths.xml /etc/mixer_paths_0.xml /etc/audio_effects.conf /etc/audio_effects.xml; do
            base="$(basename "$f")"
            extract_if_present "$f" "extracted/etc/$base"
          done
          debugfs -R 'ls -p /etc' work/system-ext4.img 2>/dev/null | grep -oE '/etc/[^:]+\.(xml|conf)$' | grep -Ei 'audio|mixer|policy|route|voice' | while IFS= read -r f; do
            base="$(basename "$f")"
            extract_if_present "$f" "extracted/etc/$base"
          done || true
          find extracted -type f -printf '%p %s bytes\n' | sort | tee report/extracted-files.txt

      - name: Search audio routing and telephony definitions
        run: |
          set -euo pipefail
          grep -RniE 'TELEPHONY_TX|TELEPHONY_RX|VOICE_CALL|VOICE_UPLINK|VOICE_DOWNLINK|VOICE_COMMUNICATION|EARPIECE|SPEAKER|AUDIO_DEVICE_IN|AUDIO_DEVICE_OUT|telephony|voice' extracted 2>/dev/null | tee report/audio-routing-matches.txt || true
          find extracted -type f \( -name '*.so' -o -name '*.conf' -o -name '*.xml' \) -print0 | xargs -0 -r file | tee report/file-types.txt

      - name: Package results
        run: |
          set -euo pipefail
          tar -czf phab-audio-inspection.tar.gz report extracted
          ls -lh phab-audio-inspection.tar.gz

      - name: Upload inspection results
        uses: actions/upload-artifact@v4
        with:
          name: phab-audio-inspection
          path: phab-audio-inspection.tar.gz
          retention-days: 7
