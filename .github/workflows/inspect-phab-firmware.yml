name: Phab Firmware Audio Inspector

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: Firmware ZIP URL
        required: true
        default: https://archive.org/download/PB2670MS000050171016ROW/PB2-670M_S000050_171016_ROW.zip

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache firmware and extracted working files
        uses: actions/cache@v4
        with:
          path: |
            cache/firmware
            cache/extracted
          key: phab-firmware-${{ hashFiles('.github/workflows/inspect-phab-firmware.yml') }}
          restore-keys: |
            phab-firmware-
      - name: Prepare cache directories
        run: mkdir -p cache/firmware cache/extracted work extracted
      - name: Download firmware only when not cached
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
        run: |
          set -euo pipefail
          archive="cache/firmware/firmware.zip"
          if [ ! -s "$archive" ]; then
            curl -L --fail --retry 3 --retry-delay 2 "$FIRMWARE_URL" -o "$archive"
          else
            echo "Using cached firmware: $archive"
          fi
          unzip -l "$archive" | grep -E 'system-sign\.img|system\.img' | head -20 || true
      - name: Inspect image structure
        run: |
          set -euo pipefail
          unzip -j -o cache/firmware/firmware.zip '*system-sign.img' -d work || true
          if [ ! -s work/system-sign.img ]; then unzip -j -o cache/firmware/firmware.zip '*system.img' -d work || true; fi
          img="work/system-sign.img"; [ -s "$img" ] || img="work/system.img"
          test -s "$img"
          mkdir -p extracted/diagnostics
          file "$img" | tee extracted/diagnostics/file.txt
          stat -c 'size=%s bytes' "$img" | tee extracted/diagnostics/size.txt
          xxd -l 256 "$img" | tee extracted/diagnostics/header.txt
          binwalk "$img" > extracted/diagnostics/binwalk.txt 2>&1 || true
          strings -a -n 8 "$img" | grep -Ei 'ext[234]|sparse|ANDROID|AVB|verity|filesystem|MTK|sign' | head -300 > extracted/diagnostics/signature-strings.txt || true
      - name: Scan for EXT4 superblock candidates
        run: |
          set -euo pipefail
          img="work/system-sign.img"; [ -s "$img" ] || img="work/system.img"
          python3 - "$img" > extracted/diagnostics/ext4-candidates.txt <<'PY'
import sys,struct
p=sys.argv[1]
with open(p,'rb') as f:
    f.seek(0,2); size=f.tell()
    # Search byte-wise rather than assuming a 4 KiB filesystem alignment.
    chunk=16*1024*1024; base=0; overlap=2048
    tail=b''
    while base<size:
        f.seek(base); data=f.read(min(chunk,size-base))
        buf=tail+data; start=base-len(tail)
        pos=0
        while True:
            i=buf.find(b'\x53\xef',pos)
            if i<0: break
            sb_abs=start+i-56-1024
            if sb_abs>=0 and sb_abs+2048<=size:
                f.seek(sb_abs+1024); sb=f.read(1024)
                try:
                    log_bs=struct.unpack_from('<I',sb,24)[0]
                    blocks_lo=struct.unpack_from('<I',sb,4)[0]
                    rev=struct.unpack_from('<I',sb,76)[0]
                    compat=struct.unpack_from('<I',sb,0x15c)[0]
                    incompat=struct.unpack_from('<I',sb,0x160)[0]
                    bs=1024<<log_bs if log_bs<8 else 0
                    if bs and blocks_lo:
                        print(f'magic=0x{sb_abs+1080:x} fs_start=0x{sb_abs:x} block_size={bs} blocks_lo={blocks_lo} revision={rev} compat=0x{compat:x} incompat=0x{incompat:x}')
                except struct.error: pass
            pos=i+2
        tail=data[-overlap:]
        base += len(data)
PY
          cat extracted/diagnostics/ext4-candidates.txt || true
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: phab-audio-inspection
          path: extracted
          if-no-files-found: error
          retention-days: 7
