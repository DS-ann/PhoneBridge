name: Inspect Phab firmware audio configuration

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: 'Direct URL to the firmware ZIP'
        required: true
        type: string
        default: 'https://archive.org/download/PB2670MS000050171016ROW/PB2-670M_S000050_171016_ROW.zip'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download firmware
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
        run: |
          set -euo pipefail
          mkdir -p work extracted report
          curl -L --fail --retry 3 --retry-all-errors -o work/firmware.zip "$FIRMWARE_URL"
          ls -lh work/firmware.zip

      - name: Extract firmware package
        run: |
          set -euo pipefail
          7z x -y work/firmware.zip -owork/package >/dev/null
          find work/package -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | tee report/package-files.txt

      - name: Locate signed system image
        run: |
          set -euo pipefail
          SYSTEM_IMG="$(find work/package -type f \( -iname 'system-sign.img' -o -iname 'system.img' \) -print -quit)"
          if [ -z "$SYSTEM_IMG" ]; then
            echo 'No system-sign.img or system.img found' >&2
            exit 1
          fi
          echo "Using system image: $SYSTEM_IMG" | tee report/system-image.txt
          cp "$SYSTEM_IMG" work/system.img
          ls -lh work/system.img

      - name: Identify image format
        run: |
          set -euo pipefail
          file work/system.img | tee report/image-file.txt
          xxd -l 512 work/system.img | tee report/image-header.txt
          echo '--- signatures ---' | tee -a report/image-file.txt
          binwalk work/system.img 2>&1 | tee report/binwalk.txt || true

      - name: Convert sparse image and locate valid EXT4 start
        run: |
          set -euo pipefail
          if simg2img work/system.img work/system-unsparse.img 2>report/simg2img.err; then
            echo 'Android sparse image converted.' | tee report/unsparse.txt
            IMG=work/system-unsparse.img
          else
            echo 'Not an Android sparse image; using original image.' | tee report/unsparse.txt
            IMG=work/system.img
          fi

          # An arbitrary 0xEF53 byte pair can occur in a signed/packed image.
          # Do not select a candidate from the magic alone. Validate the
          # surrounding EXT4 superblock fields before cutting the image.
          python3 - "$IMG" <<'PY'
          import struct, sys
          p=sys.argv[1]
          MAGIC=0xEF53
          candidates=[]
          with open(p,'rb') as f:
              pos=0
              chunk_size=64*1024*1024
              overlap=4096
              previous=b''
              while True:
                  chunk=f.read(chunk_size)
                  if not chunk: break
                  data=previous+chunk
                  base=pos-len(previous)
                  start=0
                  while True:
                      i=data.find(b'\x53\xef', start)
                      if i < 0: break
                      magic_off=base+i
                      sb_off=magic_off-0x38
                      fs_off=sb_off-1024
                      if fs_off >= 0 and fs_off % 1024 == 0:
                          f.seek(sb_off)
                          sb=f.read(1024)
                          if len(sb) >= 256 and struct.unpack_from('<H', sb, 0x38)[0] == MAGIC:
                              inodes=struct.unpack_from('<I', sb, 0x00)[0]
                              blocks=struct.unpack_from('<I', sb, 0x04)[0]
                              first_data=struct.unpack_from('<I', sb, 0x14)[0]
                              log_bs=struct.unpack_from('<I', sb, 0x18)[0]
                              log_cluster=struct.unpack_from('<I', sb, 0x1c)[0]
                              bpg=struct.unpack_from('<I', sb, 0x20)[0]
                              ipg=struct.unpack_from('<I', sb, 0x28)[0]
                              rev=struct.unpack_from('<I', sb, 0x4c)[0]
                              inode_size=struct.unpack_from('<H', sb, 0x58)[0]
                              feat_compat=struct.unpack_from('<I', sb, 0x5c)[0]
                              feat_incompat=struct.unpack_from('<I', sb, 0x60)[0]
                              feat_ro=struct.unpack_from('<I', sb, 0x64)[0]
                              block_size=1024 << log_bs if 0 <= log_bs <= 6 else 0
                              sane=(
                                  blocks > 0 and inodes > 0 and
                                  0 <= log_bs <= 6 and
                                  0 <= log_cluster <= 6 and
                                  bpg > 0 and ipg > 0 and
                                  first_data < blocks and
                                  inode_size in (128,256,512) and
                                  rev in (0,1) and
                                  block_size >= 1024
                              )
                              candidates.append((sane, fs_off, magic_off, blocks, block_size, rev, inode_size, feat_incompat, feat_ro))
                      start=i+1
                      f.seek(pos + len(chunk))
                  pos += len(chunk)
                  previous=chunk[-overlap:]
                  f.seek(pos)

          sane=[c for c in candidates if c[0]]
          print('All EXT4-like candidates:', len(candidates))
          print('Validated EXT4 candidates:', len(sane))
          for c in sane[:50]: print(c)
          with open('report/ext4-candidates.txt','w') as out:
              for c in candidates:
                  out.write('sane=%s filesystem_offset=%d magic_offset=%d blocks=%d block_size=%d revision=%d inode_size=%d incompat=0x%x ro=0x%x\n' % c)
          if sane:
              c=sane[0]
              open('work/ext4-offset','w').write(str(c[1]))
              open('work/ext4-valid','w').write('yes')
          else:
              open('work/ext4-valid','w').write('no')
          PY

          OFFSET=0
          [ -s work/ext4-offset ] && OFFSET=$(cat work/ext4-offset)
          echo "Filesystem offset: $OFFSET" | tee report/filesystem-offset.txt
          if [ "$OFFSET" = 0 ]; then
            cp "$IMG" work/system-ext4.img
          else
            dd if="$IMG" of=work/system-ext4.img bs=4096 skip=$((OFFSET/4096)) status=none
          fi
          file work/system-ext4.img | tee report/ext4-file.txt

      - name: Inspect and extract filesystem
        run: |
          set -euo pipefail
          mkdir -p extracted/mnt extracted/userspace
          if [ "$(cat work/ext4-valid)" != yes ]; then
            echo 'No validated EXT4 superblock candidate was found; extraction skipped.' | tee report/extraction-status.txt
            exit 0
          fi

          e2fsck -fn work/system-ext4.img >report/e2fsck.txt 2>&1 || true
          dumpe2fs -h work/system-ext4.img >report/ext4-header.txt 2>&1 || true

          # debugfs reads the filesystem image directly and is preferred over
          # the host kernel mount. If the Android image uses features newer
          # than the runner's e2fsprogs, record that and continue.
          if grep -qiE 'Filesystem revision too high|Bad magic number|unsupported feature' report/e2fsck.txt report/ext4-header.txt; then
            echo 'Runner e2fsprogs cannot fully validate this Android EXT4 image.' | tee report/e2fsck-status.txt
          else
            echo 'EXT4 validation completed.' | tee report/e2fsck-status.txt
          fi

          # Produce directory listings using debugfs when possible.
          for path in / /etc /system/etc /vendor/etc; do
            safe=$(echo "$path" | tr '/' '_')
            debugfs -R "ls -l $path" work/system-ext4.img >"report/debugfs${safe}.txt" 2>&1 || true
          done

          # If debugfs supports rdump, dump the likely Android configuration
          # directories. This avoids requiring a kernel mount.
          debugfs -R 'rdump /etc extracted/userspace/etc' work/system-ext4.img >report/debugfs-rdump-etc.txt 2>&1 || true
          debugfs -R 'rdump /system/etc extracted/userspace/system-etc' work/system-ext4.img >report/debugfs-rdump-system-etc.txt 2>&1 || true
          debugfs -R 'rdump /vendor/etc extracted/userspace/vendor-etc' work/system-ext4.img >report/debugfs-rdump-vendor-etc.txt 2>&1 || true
          debugfs -R 'rdump /system/lib/hw extracted/userspace/system-lib-hw' work/system-ext4.img >report/debugfs-rdump-lib-hw.txt 2>&1 || true
          debugfs -R 'rdump /system/lib64/hw extracted/userspace/system-lib64-hw' work/system-ext4.img >report/debugfs-rdump-lib64-hw.txt 2>&1 || true

          # Kernel mount is only a fallback and is not required for success.
          if sudo mount -o loop,ro,noload work/system-ext4.img extracted/mnt 2>report/mount.err; then
            echo 'Kernel read-only EXT4 mount succeeded.' | tee -a report/extraction-status.txt
          else
            echo 'Kernel read-only EXT4 mount unavailable; continuing with userspace results.' | tee -a report/extraction-status.txt
            cat report/mount.err || true
          fi

      - name: Extract audio configuration files
        run: |
          set -euo pipefail
          mkdir -p extracted/etc extracted/vendor/etc extracted/system/etc extracted/lib/hw extracted/lib64/hw

          if [ -d extracted/userspace ]; then
            find extracted/userspace -type f -print0 2>/dev/null | while IFS= read -r -d '' f; do
              rel="${f#extracted/userspace/}"
              dst="extracted/$rel"
              mkdir -p "$(dirname "$dst")"
              cp -a "$f" "$dst" 2>/dev/null || true
            done
          fi

          if mountpoint -q extracted/mnt; then
            find extracted/mnt -type f \( -iname '*audio*' -o -iname '*mixer*' -o -iname '*policy*' -o -iname '*route*' -o -iname '*voice*' \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
              rel="${f#extracted/mnt/}"
              dst="extracted/$rel"
              mkdir -p "$(dirname "$dst")"
              cp -a "$f" "$dst" 2>/dev/null || true
            done
          fi

          find extracted -type f -printf '%p %s bytes\n' | sort | tee report/extracted-files.txt

      - name: Search audio routing and telephony definitions
        run: |
          set -euo pipefail
          grep -RniE 'TELEPHONY_TX|TELEPHONY_RX|VOICE_CALL|VOICE_UPLINK|VOICE_DOWNLINK|VOICE_COMMUNICATION|EARPIECE|SPEAKER|AUDIO_DEVICE_IN|AUDIO_DEVICE_OUT|telephony|voice' extracted 2>/dev/null | tee report/audio-routing-matches.txt || true
          find extracted -type f \( -name '*.so' -o -name '*.conf' -o -name '*.xml' \) -print0 | xargs -0 -r file | tee report/file-types.txt

      - name: Unmount filesystem
        if: always()
        run: |
          sudo umount extracted/mnt 2>/dev/null || true

      - name: Package results
        run: |
          set -euo pipefail
          tar -czf phab-audio-inspection.tar.gz report extracted
          ls -lh phab-audio-inspection.tar.gz

      - name: Upload inspection results
        uses: actions/upload-artifact@v4
        with:
          name: phab-audio-inspection
          path: phab-audio-inspection.tar.gz
          retention-days: 7
