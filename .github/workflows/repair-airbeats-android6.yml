name: Repair AirBeats for Android 6

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-airbeats-android6.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          sdkmanager "build-tools;35.0.0" "platform-tools" "platforms;android-23"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Resolve DEX tools and dependencies
        run: |
          set -euo pipefail
          mkdir -p tools input work output
          cat > tools/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.airbeats.repair</groupId>
            <artifactId>dex-tools</artifactId>
            <version>1.0</version>
            <dependencies>
              <dependency><groupId>org.smali</groupId><artifactId>baksmali</artifactId><version>2.5.2</version></dependency>
              <dependency><groupId>org.smali</groupId><artifactId>smali</artifactId><version>2.5.2</version></dependency>
            </dependencies>
          </project>
          POM
          # Maven Central occasionally returns transient 403/metadata failures.
          # Retry cleanly instead of failing the whole repair on the first outage.
          for attempt in 1 2 3 4; do
            if mvn -B -U -Dmaven.wagon.http.retryHandler.count=5 -f tools/pom.xml dependency:build-classpath -Dmdep.outputFile="$GITHUB_WORKSPACE/tools/classpath.txt"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Could not resolve DEX dependencies after $attempt attempts." >&2
              exit 1
            fi
            find "$HOME/.m2/repository" -name '*.lastUpdated' -delete || true
            sleep $((attempt * 10))
          done
          test -s tools/classpath.txt

      - name: Download and validate source APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://raw.githubusercontent.com/DS-ann/PhoneBridge/main/AirBeats_v6.2.0_android6_api23_fixed.apk" -o input/AirBeats-original.apk
          test -s input/AirBeats-original.apk
          sha256sum input/AirBeats-original.apk | tee output/source-sha256.txt
          unzip -t input/AirBeats-original.apk
          unzip -Z1 input/AirBeats-original.apk | grep -E '^classes([0-9]+)?\.dex$' | sort -V > work/dex-list.txt
          test -s work/dex-list.txt

      - name: Rebuild DEX and patch known Android 7 APIs
        shell: bash
        run: |
          set -euo pipefail
          : > output/dex-report.txt
          : > output/compatibility-patches.txt
          while IFS= read -r dex; do
            [[ -n "$dex" ]] || continue
            name="${dex%.dex}"
            dir="work/dex/$name"
            mkdir -p "$dir/smali"
            unzip -p input/AirBeats-original.apk "$dex" > "$dir/input.dex"
            magic="$(head -c 8 "$dir/input.dex" | od -An -tc | tr -d ' \n')"
            printf '%s original_magic=%s bytes=%s\n' "$dex" "$magic" "$(stat -c%s "$dir/input.dex")" | tee -a output/dex-report.txt
            java -cp "$(cat tools/classpath.txt)" org.jf.baksmali.Main disassemble --api 23 "$dir/input.dex" -o "$dir/smali"

            # Android 6 ART crashed in ResolveMethodExceptionHandlerTypes while
            # verifying the original APK too. Record catch-handler types missing
            # from the API 23 framework stubs before changing anything, so a
            # subsequent compatibility fix can be based on actual evidence.
            python3 - "$dir/smali" "$dex" "$ANDROID_HOME/platforms/android-23/android.jar" <<'PY'
          import pathlib, re, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          dex_name = sys.argv[2]
          jar_path = pathlib.Path(sys.argv[3])
          with zipfile.ZipFile(jar_path) as jar:
              available = set(jar.namelist())
          catches = []
          target_catches = []
          for path in root.rglob("*.smali"):
              rel = path.relative_to(root).as_posix()
              text = path.read_text(encoding="utf-8", errors="replace")
              for line_no, line in enumerate(text.splitlines(), 1):
                  m = re.match(r"\\s*\\.catch\\s+(L[^;]+;)\\s+\\{", line)
                  if not m:
                      continue
                  typ = m.group(1)
                  entry = typ[1:-1] + ".class"
                  if typ.startswith("Landroid/") and entry not in available:
                      catches.append(f"{rel}:{line_no}: {typ}")
                  if rel in ("a2/e.smali", "da/t.smali") or rel.endswith("/a2/e.smali") or rel.endswith("/da/t.smali"):
                      target_catches.append(f"{rel}:{line_no}: {line.strip()}")
          out = pathlib.Path("output/api23-catch-handler-diagnostics.txt")
          with out.open("a", encoding="utf-8") as f:
              f.write(f"\\n[{dex_name}] framework catch types absent from android-23.jar: {len(catches)}\\n")
              f.write("\\n".join(catches) + ("\\n" if catches else ""))
              f.write(f"Catch directives in ART-reported classes (a2.e / da.t): {len(target_catches)}\\n")
              f.write("\\n".join(target_catches) + ("\\n" if target_catches else ""))
          print(f"{dex_name}: missing API23 Android catch types={len(catches)}; target class catch directives={len(target_catches)}")
          PY

            python3 - "$dir/smali" "$dex" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          dex_name = sys.argv[2]
          counts = {
              "UserManager.isUserUnlocked -> true": 0,
              "Context.isDeviceProtectedStorage -> false": 0,
              "Context.createDeviceProtectedStorageContext -> same Context": 0,
              "NotificationManager.areNotificationsEnabled -> true": 0,
          }
          patterns = [
              (re.compile(r'^\s*invoke-virtual(?:/range)?\s+\{([^}]+)\},\s*Landroid/os/UserManager;->isUserUnlocked\(\)Z\s*(?:#.*)?$'), "unlocked"),
              (re.compile(r'^\s*invoke-virtual(?:/range)?\s+\{([^}]+)\},\s*Landroid/content/Context;->isDeviceProtectedStorage\(\)Z\s*(?:#.*)?$'), "device_bool"),
              (re.compile(r'^\s*invoke-virtual(?:/range)?\s+\{([^}]+)\},\s*Landroid/content/Context;->createDeviceProtectedStorageContext\(\)Landroid/content/Context;\s*(?:#.*)?$'), "device_context"),
              (re.compile(r'^\s*invoke-virtual(?:/range)?\s+\{[^}]+\},\s*Landroid/app/NotificationManager;->areNotificationsEnabled\(\)Z\s*(?:#.*)?$'), "notifications"),
          ]
          result_re = re.compile(r'^(\s*)(move-result(?:-object)?)\s+(v\d+|p\d+)\s*(?:#.*)?$')
          for path in root.rglob("*.smali"):
              lines = path.read_text(encoding="utf-8").splitlines()
              out, i, changed = [], 0, False
              while i < len(lines):
                  hit = None
                  for invoke_re, kind in patterns:
                      match = invoke_re.match(lines[i])
                      if match:
                          hit = (kind, match)
                          break
                  if hit is None:
                      out.append(lines[i])
                      i += 1
                      continue
                  kind, match = hit
                  # Blank lines and comments can occur between the invoke and
                  # move-result in disassembled source. Do not cross instructions.
                  j = i + 1
                  while j < len(lines) and (
                      not lines[j].strip()
                      or lines[j].lstrip().startswith(("#", "."))
                  ):
                      # Debug directives such as .line/.local do not emit DEX
                      # instructions, so they may sit between invoke/result.
                      j += 1
                  if j >= len(lines):
                      raise SystemExit(f"Missing move-result after {kind} in {path}:{i+1}")
                  result = result_re.match(lines[j])
                  if result is None:
                      raise SystemExit(f"Unexpected instruction after {kind} in {path}:{j+1}: {lines[j]}")
                  indent, result_kind, dest = result.groups()
                  between = lines[i+1:j]
                  if kind in ("unlocked", "device_bool", "notifications"):
                      if result_kind != "move-result":
                          raise SystemExit(f"Expected move-result for {kind} in {path}:{i+1}")
                      value = "0x0" if kind == "device_bool" else "0x1"
                      out.append(f"{indent}const/4 {dest}, {value}")
                      out.extend(between)
                      label = {
                          "unlocked": "UserManager.isUserUnlocked -> true",
                          "device_bool": "Context.isDeviceProtectedStorage -> false",
                          "notifications": "NotificationManager.areNotificationsEnabled -> true",
                      }[kind]
                      counts[label] += 1
                  else:
                      if result_kind != "move-result-object":
                          raise SystemExit(f"Expected move-result-object for {kind} in {path}:{i+1}")
                      # This method has only the receiver argument. On API <24,
                      # use the existing Context as the compatibility fallback.
                      receiver_text = match.group(1).split(",", 1)[0].strip()
                      receiver = receiver_text.split(" .. ", 1)[0].strip()
                      out.append("{}move-object {}, {}".format(indent, dest, receiver))
                      out.extend(between)
                      counts["Context.createDeviceProtectedStorageContext -> same Context"] += 1
                  i = j + 1
                  changed = True
              if changed:
                  path.write_text("\n".join(out) + "\n", encoding="utf-8")
          with pathlib.Path("output/compatibility-patches.txt").open("a", encoding="utf-8") as f:
              f.write(f"{dex_name}:\n")
              for name, count in counts.items():
                  f.write(f"  {name}: {count}\n")
          print(dex_name, counts)
          PY

            if grep -R -E 'Landroid/os/UserManager;->isUserUnlocked\(\)Z|Landroid/content/Context;->(isDeviceProtectedStorage\(\)Z|createDeviceProtectedStorageContext\(\)Landroid/content/Context;)|Landroid/app/NotificationManager;->areNotificationsEnabled\(\)Z' "$dir/smali" --include='*.smali'; then
              echo "Known API 24+ reference remains after patch in $dex" | tee -a output/dex-report.txt
              exit 1
            fi
            java -cp "$(cat tools/classpath.txt)" org.jf.smali.Main assemble --api 23 -o "work/$dex" "$dir/smali"
          done < work/dex-list.txt

      - name: Rebuild APK and validate DEX
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile
          src = pathlib.Path("input/AirBeats-original.apk")
          dest = pathlib.Path("work/AirBeats-rebuilt-unsigned.apk")
          dexes = [x.strip() for x in pathlib.Path("work/dex-list.txt").read_text().splitlines() if x.strip()]
          with zipfile.ZipFile(src, "r") as zin, zipfile.ZipFile(dest, "w") as zout:
              for item in zin.infolist():
                  upper = item.filename.upper()
                  # Remove stale signatures because the DEX content changed.
                  if upper == "META-INF/MANIFEST.MF" or (upper.startswith("META-INF/") and upper.endswith((".RSA", ".DSA", ".EC", ".SF"))):
                      continue
                  if item.filename in dexes:
                      zout.writestr(item, pathlib.Path("work", item.filename).read_bytes())
                  else:
                      zout.writestr(item, zin.read(item.filename))
          with zipfile.ZipFile(dest) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Bad ZIP entry: {bad}")
              for dex in dexes:
                  data = z.read(dex)
                  if not data.startswith(b"dex\n035\0"):
                      raise SystemExit(f"{dex} is not DEX 035: {data[:8]!r}")
          print("Rebuilt and verified DEX files:", ", ".join(dexes))
          PY

      - name: Report remaining known Android 7+ API references
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Known Android 7+ API references after patch:"
            if grep -R -n -E 'Landroid/os/UserManager;->isUserUnlocked|Landroid/content/Context;->(isDeviceProtectedStorage|createDeviceProtectedStorageContext)|Landroid/app/NotificationManager;->areNotificationsEnabled' work/dex --include='*.smali'; then
              true
            else
              echo "None of the specifically checked references remain."
            fi
            echo
            echo "This is a targeted check, not a complete API-level verifier."
          } > output/api24-reference-report.txt

      - name: Align, sign, and verify APK
        id: sign
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore work/airbeats-repair.jks \
            -storepass repairpass -keypass repairpass -alias repair \
            -dname "CN=AirBeats Android 6 compatibility repair" -keyalg RSA -keysize 2048 -validity 10000
          zipalign -f -p 4 work/AirBeats-rebuilt-unsigned.apk work/AirBeats-aligned.apk
          apksigner sign --ks work/airbeats-repair.jks --ks-pass pass:repairpass \
            --key-pass pass:repairpass --out output/AirBeats_v6.2.0_android6_repaired.apk work/AirBeats-aligned.apk
          apksigner verify --verbose output/AirBeats_v6.2.0_android6_repaired.apk
          sha256sum output/AirBeats_v6.2.0_android6_repaired.apk | tee output/repaired-sha256.txt
          aapt dump badging output/AirBeats_v6.2.0_android6_repaired.apk > output/apk-badging.txt
          head -30 output/apk-badging.txt

      - name: Prepare Android 6 emulator smoke-test script
        run: |
          cat > output/android6-smoke-test.sh <<'BASH'
          #!/usr/bin/env bash
          set -u
          mkdir -p output
          echo "Android 6 emulator runtime test" > output/android6-test-report.txt
          adb shell getprop ro.build.version.release >> output/android6-test-report.txt
          adb shell getprop ro.build.version.sdk >> output/android6-test-report.txt
          echo >> output/android6-test-report.txt
          # Control test the unmodified source APK first. This distinguishes
          # an original-app/Android-6 ART failure from a regression introduced by
          # the DEX rebuild. Keep its logs separate from the candidate run.
          adb logcat -c
          adb install -r input/AirBeats-original.apk > output/android6-original-install.txt 2>&1
          original_install_rc=$?
          cat output/android6-original-install.txt
          echo "original_install_exit=$original_install_rc" >> output/android6-test-report.txt
          if [ "$original_install_rc" -eq 0 ]; then
            adb shell monkey -p com.darkxvenom.airbeats 1 > output/android6-original-launch.txt 2>&1
            sleep 15
            adb logcat -d -v threadtime > output/android6-original-logcat.txt
            adb uninstall com.darkxvenom.airbeats >/dev/null 2>&1
          else
            echo "Original APK control could not be installed." >> output/android6-test-report.txt
            adb logcat -d -v threadtime > output/android6-original-logcat.txt
          fi

          adb logcat -c
          adb install -r output/AirBeats_v6.2.0_android6_repaired.apk > output/android6-install.txt 2>&1
          install_rc=$?
          cat output/android6-install.txt
          if [ "$install_rc" -ne 0 ]; then
            if grep -q "INSTALL_FAILED_NO_MATCHING_ABIS" output/android6-install.txt; then
              echo "RESULT=ENVIRONMENT_ABI_MISMATCH: APK has no native ABI compatible with this API 23 x86_64 emulator." | tee -a output/android6-test-report.txt
            else
              echo "RESULT=INSTALL_FAILED (exit $install_rc)" | tee -a output/android6-test-report.txt
            fi
            exit 1
          fi
          echo "Install succeeded." | tee -a output/android6-test-report.txt
          adb shell monkey -p com.darkxvenom.airbeats 1 > output/android6-launch.txt 2>&1
          launch_rc=$?
          cat output/android6-launch.txt
          echo "monkey_exit=$launch_rc" >> output/android6-test-report.txt
          sleep 30
          adb logcat -d -v threadtime > output/android6-logcat.txt
          adb shell dumpsys activity activities > output/android6-activities.txt 2>&1
          adb shell dumpsys package com.darkxvenom.airbeats > output/android6-package.txt 2>&1
          if grep -E -i 'FATAL EXCEPTION:.*(com\.darkxvenom\.airbeats|airbeats)|Process: com\.darkxvenom\.airbeats|NoSuchMethodError|NoClassDefFoundError|VerifyError|dex2oat.*(SIGSEGV|fatal)|Fatal signal [0-9]+|Process com\.darkxvenom\.airbeats.*has died|Unable to start activity.*com\.darkxvenom\.airbeats' output/android6-logcat.txt > output/android6-crash-matches.txt; then
            echo "RESULT=CRASH_SIGNATURE_FOUND" | tee -a output/android6-test-report.txt
            cat output/android6-crash-matches.txt
            exit 1
          fi
          if ! grep -q 'com.darkxvenom.airbeats' output/android6-logcat.txt; then
            echo "RESULT=NO_APP_LOGS_FOUND; launch may not have reached the app." | tee -a output/android6-test-report.txt
            exit 1
          fi
          echo "RESULT=NO_KNOWN_STARTUP_CRASH_SIGNATURE_IN_30_SECONDS" | tee -a output/android6-test-report.txt
          echo "This is a smoke test, not proof that every app feature works." >> output/android6-test-report.txt
          BASH
          chmod +x output/android6-smoke-test.sh

      - name: Run repaired APK on Android 6 (API 23) emulator
        id: android6_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash output/android6-smoke-test.sh

      - name: Upload repaired APK and diagnostics
        if: always() && steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Android6-repair-candidate
          path: |
            output/AirBeats_v6.2.0_android6_repaired.apk
            output/dex-report.txt
            output/source-sha256.txt
            output/repaired-sha256.txt
            output/apk-badging.txt
            output/compatibility-patches.txt
            output/api24-reference-report.txt
            output/api23-catch-handler-diagnostics.txt
            output/android6-test-report.txt
            output/android6-original-install.txt
            output/android6-original-launch.txt
            output/android6-original-logcat.txt
            output/android6-install.txt
            output/android6-launch.txt
            output/android6-logcat.txt
            output/android6-activities.txt
            output/android6-package.txt
            output/android6-crash-matches.txt
          if-no-files-found: error
          retention-days: 14
