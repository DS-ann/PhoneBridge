name: Repair AirBeats for Android 6

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-airbeats-android6.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          mkdir -p output
          sdkmanager "build-tools;35.0.1" "platform-tools" "platforms;android-23"
          echo "$ANDROID_HOME/build-tools/35.0.1" >> "$GITHUB_PATH"
          # Google ships native SDK build-tools binaries for x86_64 only.
          # Replace zipalign with a Linux ARM64 build before invoking it on this runner.
          curl -fsSL https://raw.githubusercontent.com/Commit451/android-arm-build-tools/main/install.sh -o /tmp/install-arm-build-tools.sh
          bash /tmp/install-arm-build-tools.sh --version 35.0.1 --sdk "$ANDROID_HOME"
          file "$ANDROID_HOME/build-tools/35.0.1/zipalign" | tee output/zipalign-binary-info.txt
          grep -q "ARM aarch64" output/zipalign-binary-info.txt

      - name: Resolve DEX tools and dependencies
        run: |
          set -euo pipefail
          mkdir -p tools input work output
          cat > tools/pom.xml <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>local.airbeats.repair</groupId>
            <artifactId>dex-tools</artifactId>
            <version>1.0</version>
            <dependencies>
              <dependency><groupId>org.smali</groupId><artifactId>baksmali</artifactId><version>2.5.2</version></dependency>
              <dependency><groupId>org.smali</groupId><artifactId>smali</artifactId><version>2.5.2</version></dependency>
            </dependencies>
          </project>
          POM
          # Maven Central occasionally returns transient 403/metadata failures.
          # Retry cleanly instead of failing the whole repair on the first outage.
          for attempt in 1 2 3 4; do
            if mvn -B -U -Dmaven.wagon.http.retryHandler.count=5 -f tools/pom.xml dependency:build-classpath -Dmdep.outputFile="$GITHUB_WORKSPACE/tools/classpath.txt"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Could not resolve DEX dependencies after $attempt attempts." >&2
              exit 1
            fi
            find "$HOME/.m2/repository" -name '*.lastUpdated' -delete || true
            sleep $((attempt * 10))
          done
          test -s tools/classpath.txt

      - name: Download and validate source APK
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://raw.githubusercontent.com/DS-ann/PhoneBridge/main/AirBeats_v6.2.0_android6_api23_fixed.apk" -o input/AirBeats-original.apk
          test -s input/AirBeats-original.apk
          sha256sum input/AirBeats-original.apk | tee output/source-sha256.txt
          unzip -t input/AirBeats-original.apk
          unzip -Z1 input/AirBeats-original.apk | grep -E '^classes([0-9]+)?\.dex$' | sort -V > work/dex-list.txt
          test -s work/dex-list.txt

      - name: Rebuild DEX and patch known Android 7 APIs
        shell: bash
        run: |
          set -euo pipefail
          : > output/dex-report.txt
          : > output/compatibility-patches.txt
          while IFS= read -r dex; do
            [[ -n "$dex" ]] || continue
            name="${dex%.dex}"
            dir="work/dex/$name"
            mkdir -p "$dir/smali"
            unzip -p input/AirBeats-original.apk "$dex" > "$dir/input.dex"
            magic="$(head -c 8 "$dir/input.dex" | od -An -tc | tr -d ' \n')"
            printf '%s original_magic=%s bytes=%s\n' "$dex" "$magic" "$(stat -c%s "$dir/input.dex")" | tee -a output/dex-report.txt
            java -cp "$(cat tools/classpath.txt)" org.jf.baksmali.Main disassemble --api 23 "$dir/input.dex" -o "$dir/smali"

            # Android 6 ART crashed in ResolveMethodExceptionHandlerTypes while
            # verifying the original APK too. Record catch-handler types missing
            # from the API 23 framework stubs before changing anything, so a
            # subsequent compatibility fix can be based on actual evidence.
            python3 - "$dir/smali" "$dex" "$ANDROID_HOME/platforms/android-23/android.jar" <<'PY'
          import pathlib, re, sys, zipfile
          root = pathlib.Path(sys.argv[1])
          dex_name = sys.argv[2]
          jar_path = pathlib.Path(sys.argv[3])
          with zipfile.ZipFile(jar_path) as jar:
              platform = {n[:-6] for n in jar.namelist() if n.endswith(".class")}
          defined = set()
          catches = []
          targets = []
          for path in root.rglob("*.smali"):
              rel = path.relative_to(root).as_posix()
              source = path.read_text(encoding="utf-8", errors="replace")
              cls = re.search(r"^\\.class\\s+[^\\n]*?\\s+(L[^;]+;)", source, re.M)
              if cls:
                  defined.add(cls.group(1)[1:-1])
              if rel in ("a2/e.smali", "a7/c.smali") or rel.endswith("/a2/e.smali") or rel.endswith("/a7/c.smali"):
                  targets.append(f"--- {dex_name}:{rel} ---")
                  targets.extend(f"{i}: {line.strip()}" for i, line in enumerate(source.splitlines(), 1) if ".catch" in line or ".catchall" in line)
              for line_no, line in enumerate(source.splitlines(), 1):
                  m = re.match(r"\\s*\\.catch\\s+(L[^;]+;)\\s+\\{", line)
                  if m:
                      typ = m.group(1)
                      if typ[1:-1] not in platform and typ[1:-1] not in defined:
                          catches.append(f"{rel}:{line_no}: {typ} (not in this DEX or android-23.jar; may be in another DEX)")
          out = pathlib.Path("output/api23-catch-handler-diagnostics.txt")
          with out.open("a", encoding="utf-8") as f:
              f.write(f"\\n[{dex_name}] catch types absent from this DEX + android-23.jar: {len(catches)}\\n")
              f.write("\\n".join(catches) + ("\\n" if catches else ""))
              f.write("\\nART-reported class catch directives:\\n")
              f.write("\\n".join(targets) + ("\\n" if targets else ""))
          print(f"{dex_name}: unresolved-in-this-DEX catch types={len(catches)}; ART target catch lines={len(targets)}")
          PY

            python3 - "$dir/smali" "$dex" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          dex_name = sys.argv[2]
          counts = {
              "UserManager.isUserUnlocked -> true": 0,
              "Context.isDeviceProtectedStorage -> false": 0,
              "Context.createDeviceProtectedStorageContext -> same Context": 0,
              "NotificationManager.areNotificationsEnabled -> true": 0,
          }
          patterns = [
              (re.compile(r'^\s*invoke-virtual(?:/range)?\s+\{([^}]+)\},\s*Landroid/os/UserManager;->isUserUnlocked\(\)Z\s*(?:#.*)?$'), "unlocked"),
              (re.compile(r'^\s*invoke-virtual(?:/range)?\s+\{([^}]+)\},\s*Landroid/content/Context;->isDeviceProtectedStorage\(\)Z\s*(?:#.*)?$'), "device_bool"),
              (re.compile(r'^\s*invoke-virtual(?:/range)?\s+\{([^}]+)\},\s*Landroid/content/Context;->createDeviceProtectedStorageContext\(\)Landroid/content/Context;\s*(?:#.*)?$'), "device_context"),
              (re.compile(r'^\s*invoke-virtual(?:/range)?\s+\{[^}]+\},\s*Landroid/app/NotificationManager;->areNotificationsEnabled\(\)Z\s*(?:#.*)?$'), "notifications"),
          ]
          result_re = re.compile(r'^(\s*)(move-result(?:-object)?)\s+(v\d+|p\d+)\s*(?:#.*)?$')
          for path in root.rglob("*.smali"):
              lines = path.read_text(encoding="utf-8").splitlines()
              out, i, changed = [], 0, False
              while i < len(lines):
                  hit = None
                  for invoke_re, kind in patterns:
                      match = invoke_re.match(lines[i])
                      if match:
                          hit = (kind, match)
                          break
                  if hit is None:
                      out.append(lines[i])
                      i += 1
                      continue
                  kind, match = hit
                  # Blank lines and comments can occur between the invoke and
                  # move-result in disassembled source. Do not cross instructions.
                  j = i + 1
                  while j < len(lines) and (
                      not lines[j].strip()
                      or lines[j].lstrip().startswith(("#", "."))
                  ):
                      # Debug directives such as .line/.local do not emit DEX
                      # instructions, so they may sit between invoke/result.
                      j += 1
                  if j >= len(lines):
                      raise SystemExit(f"Missing move-result after {kind} in {path}:{i+1}")
                  result = result_re.match(lines[j])
                  if result is None:
                      raise SystemExit(f"Unexpected instruction after {kind} in {path}:{j+1}: {lines[j]}")
                  indent, result_kind, dest = result.groups()
                  between = lines[i+1:j]
                  if kind in ("unlocked", "device_bool", "notifications"):
                      if result_kind != "move-result":
                          raise SystemExit(f"Expected move-result for {kind} in {path}:{i+1}")
                      value = "0x0" if kind == "device_bool" else "0x1"
                      out.append(f"{indent}const/4 {dest}, {value}")
                      out.extend(between)
                      label = {
                          "unlocked": "UserManager.isUserUnlocked -> true",
                          "device_bool": "Context.isDeviceProtectedStorage -> false",
                          "notifications": "NotificationManager.areNotificationsEnabled -> true",
                      }[kind]
                      counts[label] += 1
                  else:
                      if result_kind != "move-result-object":
                          raise SystemExit(f"Expected move-result-object for {kind} in {path}:{i+1}")
                      # This method has only the receiver argument. On API <24,
                      # use the existing Context as the compatibility fallback.
                      receiver_text = match.group(1).split(",", 1)[0].strip()
                      receiver = receiver_text.split(" .. ", 1)[0].strip()
                      out.append("{}move-object {}, {}".format(indent, dest, receiver))
                      out.extend(between)
                      counts["Context.createDeviceProtectedStorageContext -> same Context"] += 1
                  i = j + 1
                  changed = True
              if changed:
                  path.write_text("\n".join(out) + "\n", encoding="utf-8")
          with pathlib.Path("output/compatibility-patches.txt").open("a", encoding="utf-8") as f:
              f.write(f"{dex_name}:\n")
              for name, count in counts.items():
                  f.write(f"  {name}: {count}\n")
          print(dex_name, counts)
          PY

            # Android 6 ART crashes natively while resolving exception-handler types
            # in a7/c.createFromParcel. Its only non-platform catch type is bg/a.
            # Use the platform RuntimeException base type for that single handler
            # to avoid loading the obfuscated handler class during verifier setup.
            # Keep this surgical: broad catch rewrites previously overflowed DEX
            # handler offsets during assembly.
            if [[ "$dex" == "classes.dex" && -f "$dir/smali/a7/c.smali" ]]; then
              python3 - "$dir/smali/a7/c.smali" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          old = re.compile(r'^(\s*\.catch\s+)Lbg/a;(\s+\{)', re.M)
          s2, n = old.subn(r'\1Ljava/lang/RuntimeException;\2', s)
          if n != 1:
              raise SystemExit(f"Expected exactly one a7/c catch for Lbg/a;, found {n}; refusing unsafe rewrite")
          p.write_text(s2, encoding="utf-8")
          with open("output/compatibility-patches.txt", "a", encoding="utf-8") as f:
              f.write("classes.dex: a7/c catch Lbg/a; -> Ljava/lang/RuntimeException; (Android 6 ART verifier workaround): 1\\n")
          print("Patched one a7/c exception handler for Android 6 ART compatibility")
          PY
            fi

            if grep -R -E 'Landroid/os/UserManager;->isUserUnlocked\(\)Z|Landroid/content/Context;->(isDeviceProtectedStorage\(\)Z|createDeviceProtectedStorageContext\(\)Landroid/content/Context;)|Landroid/app/NotificationManager;->areNotificationsEnabled\(\)Z' "$dir/smali" --include='*.smali'; then
              echo "Known API 24+ reference remains after patch in $dex" | tee -a output/dex-report.txt
              exit 1
            fi
            java -cp "$(cat tools/classpath.txt)" org.jf.smali.Main assemble --api 23 -o "work/$dex" "$dir/smali"
          done < work/dex-list.txt

      - name: Preserve API-23-assembled DEX files
        shell: bash
        run: |
          set -euo pipefail
          # The earlier catch-type rewrite made dexlib2 fail while writing
          # La/a;->b(...) with handler offset 74626 (> the DEX ushort limit).
          # Keep the already successfully assembled API-23 DEX files intact.
          while IFS= read -r dex; do
            [[ -n "$dex" ]] || continue
            test -s "work/$dex"
            printf '%s ' "$dex"
            sha256sum "work/$dex"
          done < work/dex-list.txt | tee output/hardened-dex-sha256.txt

      - name: Rebuild APK and validate DEX
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile
          src = pathlib.Path("input/AirBeats-original.apk")
          dest = pathlib.Path("work/AirBeats-rebuilt-unsigned.apk")
          dexes = [x.strip() for x in pathlib.Path("work/dex-list.txt").read_text().splitlines() if x.strip()]
          with zipfile.ZipFile(src, "r") as zin, zipfile.ZipFile(dest, "w") as zout:
              for item in zin.infolist():
                  upper = item.filename.upper()
                  # Remove stale signatures because the DEX content changed.
                  if upper == "META-INF/MANIFEST.MF" or (upper.startswith("META-INF/") and upper.endswith((".RSA", ".DSA", ".EC", ".SF"))):
                      continue
                  if item.filename in dexes:
                      zout.writestr(item, pathlib.Path("work", item.filename).read_bytes())
                  else:
                      zout.writestr(item, zin.read(item.filename))
          with zipfile.ZipFile(dest) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Bad ZIP entry: {bad}")
              for dex in dexes:
                  data = z.read(dex)
                  if not data.startswith(b"dex\n035\0"):
                      raise SystemExit(f"{dex} is not DEX 035: {data[:8]!r}")
          print("Rebuilt and verified DEX files:", ", ".join(dexes))
          PY

      - name: Report remaining known Android 7+ API references
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Known Android 7+ API references after patch:"
            if grep -R -n -E 'Landroid/os/UserManager;->isUserUnlocked|Landroid/content/Context;->(isDeviceProtectedStorage|createDeviceProtectedStorageContext)|Landroid/app/NotificationManager;->areNotificationsEnabled' work/dex --include='*.smali'; then
              true
            else
              echo "None of the specifically checked references remain."
            fi
            echo
            echo "This is a targeted check, not a complete API-level verifier."
          } > output/api24-reference-report.txt

      - name: Align, sign, and verify APK
        id: sign
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore work/airbeats-repair.jks \
            -storepass repairpass -keypass repairpass -alias repair \
            -dname "CN=AirBeats Android 6 compatibility repair" -keyalg RSA -keysize 2048 -validity 10000
          zipalign -f -p 4 work/AirBeats-rebuilt-unsigned.apk work/AirBeats-aligned.apk
          apksigner sign --ks work/airbeats-repair.jks --ks-pass pass:repairpass \
            --key-pass pass:repairpass --out output/AirBeats_v6.2.0_android6_repaired.apk work/AirBeats-aligned.apk
          apksigner verify --verbose output/AirBeats_v6.2.0_android6_repaired.apk
          sha256sum output/AirBeats_v6.2.0_android6_repaired.apk | tee output/repaired-sha256.txt
          # Avoid the SDK aapt executable here: Google distributes it as x86_64-only,
          # while this job runs natively on ARM64. APK ZIP and signature checks above
          # are the relevant validation for this packaging stage.
          unzip -p output/AirBeats_v6.2.0_android6_repaired.apk AndroidManifest.xml > output/manifest-binary.xml
          test -s output/manifest-binary.xml

      - name: Validate ARM64 APK before runtime emulator test
        id: android6_test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK=output/AirBeats_v6.2.0_android6_repaired.apk
          test -s "$APK"
          unzip -t "$APK"
          apksigner verify --verbose "$APK"
          python3 - "$APK" <<'PY'
          import pathlib, sys, zipfile
          apk = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              dexes = sorted(n for n in names if n == "classes.dex" or (n.startswith("classes") and n.endswith(".dex") and n[7:-4].isdigit()))
              if not dexes:
                  raise SystemExit("APK contains no DEX files")
              for dex in dexes:
                  data = z.read(dex)
                  if not data.startswith(b"dex\n035\0"):
                      raise SystemExit(f"{dex} is not DEX 035")
              native = sorted(n for n in names if n.startswith("lib/arm64-v8a/") and n.endswith(".so"))
              if not native:
                  raise SystemExit("APK has no ARM64 native libraries")
              print("DEX files:", ", ".join(dexes))
              print("ARM64 native libraries:", len(native))
          PY
          {
            echo "RESULT=APK_BUILD_DEX_AND_SIGNATURE_VALID"
            echo "Target: Android 6 / API 23 / ARM64"
            echo "Runtime launch test: delegated to the macOS ARM64 emulator job."
            echo "Static validation alone does not prove the app launches."
          } | tee output/android6-test-report.txt

      - name: Upload repaired APK and diagnostics
        if: always() && steps.sign.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Android6-repair-candidate
          path: |
            output/AirBeats_v6.2.0_android6_repaired.apk
            output/dex-report.txt
            output/source-sha256.txt
            output/repaired-sha256.txt
            output/apk-badging.txt
            output/compatibility-patches.txt
            output/art-exception-handler-hardening.txt
            output/hardened-dex-sha256.txt
            output/api24-reference-report.txt
            output/api23-catch-handler-diagnostics.txt
            output/android6-test-report.txt
            output/android6-original-install.txt
            output/android6-original-launch.txt
            output/android6-original-logcat.txt
            output/android6-install.txt
            output/android6-launch.txt
            output/android6-logcat.txt
            output/android6-activities.txt
            output/android6-package.txt
            output/android6-crash-matches.txt
            output/android6-tombstones.txt
          if-no-files-found: error
          retention-days: 14


  runtime-test:
    name: Android 6 API 23 ARM64 runtime test
    needs: repair
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Set up Android SDK and API 23 ARM64 system image
        uses: android-actions/setup-android@v3
        with:
          packages: |
            emulator
            platform-tools
            platforms;android-23
            build-tools;35.0.1
            system-images;android-23;google_apis;arm64-v8a

      - name: Download repaired APK
        uses: actions/download-artifact@v4
        with:
          name: AirBeats-Android6-repair-candidate
          path: candidate

      - name: Create and boot Android 6 ARM64 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo "Host architecture: $(uname -m)"
          test "$(uname -m)" = "arm64"
          sdkmanager --list_installed | grep -E 'emulator|platform-tools|system-images;android-23;google_apis;arm64-v8a'
          avdmanager create avd -n airbeats-api23-arm64 -k "system-images;android-23;google_apis;arm64-v8a" -d "Nexus 5" --force
          nohup emulator -avd airbeats-api23-arm64 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save > emulator-startup.log 2>&1 &
          echo $! > emulator.pid
          adb wait-for-device
          booted=0
          for attempt in $(seq 1 90); do
            state="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$state" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          if [ "$booted" -ne 1 ]; then
            echo "Android 6 ARM64 emulator did not finish booting."
            tail -200 emulator-startup.log || true
            exit 1
          fi
          adb shell getprop ro.build.version.sdk | grep -qx '23'
          adb shell getprop ro.product.cpu.abi | grep -q 'arm64-v8a'
          adb shell getprop | grep -E 'ro.build.version.release|ro.build.version.sdk|ro.product.cpu.abi'

      - name: Install and launch AirBeats
        id: launch
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find candidate -type f -name 'AirBeats_v6.2.0_android6_repaired.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          aapt dump badging "$APK" > package-badging.txt
          PACKAGE="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" package-badging.txt | head -1)"
          test -n "$PACKAGE"
          echo "Package ID: $PACKAGE"
          adb install -r "$APK" 2>&1 | tee install-result.txt
          adb shell monkey -p "$PACKAGE" 1 2>&1 | tee launch-result.txt
          sleep 20
          adb logcat -d -v time > android6-logcat.txt
          if grep -E -i 'FATAL EXCEPTION|Fatal signal [0-9]+|NoSuchMethodError.*isUserUnlocked|Unable to start activity' android6-logcat.txt; then
            echo "Detected an app startup crash in logcat."
            exit 1
          fi
          echo "RESULT=ANDROID_6_API_23_ARM64_INSTALL_AND_LAUNCH_NO_FATAL_CRASH"
          echo "Package: $PACKAGE"
          echo "SDK: $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "ABI: $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"

      - name: Upload emulator logs and runtime-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Android6-ARM64-runtime-test
          path: |
            emulator-startup.log
            package-badging.txt
            install-result.txt
            launch-result.txt
            android6-logcat.txt
          if-no-files-found: warn
          retention-days: 14
