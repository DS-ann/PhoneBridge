name: Phab Firmware Audio Inspector Fixed

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Firmware ZIP URL"
        required: true
        type: string
        default: "https://archive.org/download/PB2670MS000050171016ROW/PB2-670M_S000050_171016_ROW.zip"

jobs:
  inspect:
    name: Inspect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached system image
        id: system-cache
        uses: actions/cache@v4
        with:
          path: cache/system
          key: phab-system-image-v1

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache/system work extracted/diagnostics extracted/system

      - name: Download firmware and extract system image on cache miss
        if: steps.system-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
        run: |
          set -euo pipefail
          mkdir -p work/download
          archive="work/download/firmware.zip"
          curl -L --fail --retry 3 "$FIRMWARE_URL" -o "$archive"
          unzip -j -o "$archive" '*system-sign.img' -d cache/system || true
          if [ ! -s cache/system/system-sign.img ]; then
            echo "system-sign.img was not found in the firmware archive."
            exit 1
          fi
          ls -lh cache/system/system-sign.img

      - name: Use cached system image
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s cache/system/system-sign.img ]; then
            echo "Cached system-sign.img is missing."
            exit 1
          fi
          cp cache/system/system-sign.img work/system-sign.img
          echo "Using system-sign.img from cache."
          ls -lh work/system-sign.img

      - name: Inspect image
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/inspect_phab_system_image.py work/system-sign.img work/system-payload.img extracted/diagnostics/bfbf-header.txt extracted/diagnostics/ext4-scan.txt
          file work/system-sign.img > extracted/diagnostics/file.txt || true
          stat -c 'size=%s bytes' work/system-sign.img > extracted/diagnostics/size.txt
          xxd -l 512 work/system-sign.img > extracted/diagnostics/header.txt || true
          cat extracted/diagnostics/bfbf-header.txt || true
          cat extracted/diagnostics/ext4-scan.txt || true

      - name: Extract validated filesystem
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s work/ext4-selection.txt ]; then
            echo "No validated EXT4 filesystem; skipping extraction."
            exit 0
          fi
          read -r start bs blocks < work/ext4-selection.txt
          bytes=$((bs * blocks))
          dd if="work/system-payload.img" of=work/system-ext4.img bs=1 skip="$start" count="$bytes" status=none
          for f in audio_policy.conf audio_policy_configuration.xml audio_effects.conf audio_platform_info.xml; do
            debugfs -R "dump /etc/$f extracted/system/$f" work/system-ext4.img >/dev/null 2>&1 || true
          done
          find extracted/system -type f -print > extracted/diagnostics/extracted-files.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phab-audio-inspection
          path: extracted/diagnostics
          retention-days: 7

      - name: Upload audio configuration
        uses: actions/upload-artifact@v4
        with:
          name: phab-audio-config
          path: extracted/system
          if-no-files-found: ignore
          retention-days: 7
