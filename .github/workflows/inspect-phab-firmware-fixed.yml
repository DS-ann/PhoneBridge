name: Phab Firmware Audio Inspector Fixed

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Firmware ZIP URL"
        required: true
        type: string
        default: "https://archive.org/download/PB2670MS000050171016ROW/PB2-670M_S000050_171016_ROW.zip"

jobs:
  inspect:
    name: Inspect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache firmware
        uses: actions/cache@v4
        with:
          path: cache/firmware
          key: phab-firmware-cache-v1

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache/firmware work extracted/diagnostics extracted/system

      - name: Download firmware if needed
        shell: bash
        env:
          FIRMWARE_URL: ${{ inputs.firmware_url }}
        run: |
          set -euo pipefail
          archive="cache/firmware/firmware.zip"
          if [ ! -s "$archive" ]; then
            curl -L --fail --retry 3 "$FIRMWARE_URL" -o "$archive"
          else
            echo "Using cached firmware."
          fi
          ls -lh "$archive"

      - name: Extract system image
        shell: bash
        run: |
          set -euo pipefail
          rm -f work/system-sign.img work/system.img work/image-path.txt
          unzip -j -o cache/firmware/firmware.zip '*system-sign.img' -d work || true
          if [ -s work/system-sign.img ]; then
            echo "work/system-sign.img" > work/image-path.txt
          else
            unzip -j -o cache/firmware/firmware.zip '*system.img' -d work || true
            if [ -s work/system.img ]; then
              echo "work/system.img" > work/image-path.txt
            else
              echo "No system image found."
              exit 1
            fi
          fi

      - name: Inspect image
        shell: bash
        run: |
          set -euo pipefail
          img="$(cat work/image-path.txt)"
          python3 scripts/inspect_phab_system_image.py "$img" work/system-payload.img extracted/diagnostics/bfbf-header.txt extracted/diagnostics/ext4-scan.txt
          file "$img" > extracted/diagnostics/file.txt || true
          stat -c 'size=%s bytes' "$img" > extracted/diagnostics/size.txt
          xxd -l 512 "$img" > extracted/diagnostics/header.txt || true
          cat extracted/diagnostics/bfbf-header.txt || true
          cat extracted/diagnostics/ext4-scan.txt || true

      - name: Extract validated filesystem
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s work/ext4-selection.txt ]; then
            echo "No validated EXT4 filesystem; skipping extraction."
            exit 0
          fi
          read -r start bs blocks < work/ext4-selection.txt
          img="$(cat work/image-path.txt)"
          bytes=$((bs * blocks))
          dd if="$img" of=work/system-ext4.img bs=1 skip="$start" count="$bytes" status=none
          for f in audio_policy.conf audio_policy_configuration.xml audio_effects.conf audio_platform_info.xml; do
            debugfs -R "dump /etc/$f extracted/system/$f" work/system-ext4.img >/dev/null 2>&1 || true
          done
          find extracted/system -type f -print > extracted/diagnostics/extracted-files.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phab-audio-inspection
          path: extracted/diagnostics
          retention-days: 7

      - name: Upload audio configuration
        uses: actions/upload-artifact@v4
        with:
          name: phab-audio-config
          path: extracted/system
          if-no-files-found: ignore
          retention-days: 7
