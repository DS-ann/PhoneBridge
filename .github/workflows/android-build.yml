name: PhoneBridge Audio Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audio-bridges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Phab audio bridge
        working-directory: phab-bridge
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build Pad audio bridge
        working-directory: pad-client
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Phab APK
        uses: actions/upload-artifact@v4
        with:
          name: phonebridge-phab-audio-debug
          path: phab-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Pad APK
        uses: actions/upload-artifact@v4
        with:
          name: phonebridge-pad-audio-debug
          path: pad-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
