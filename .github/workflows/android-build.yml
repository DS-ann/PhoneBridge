name: Android HFP Diagnostic Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hfp-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.7
        working-directory: hfp-diagnostic
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build HFP Diagnostic debug APK
        working-directory: hfp-diagnostic
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload HFP Diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: phonebridge-hfp-diagnostic-debug
          path: hfp-diagnostic/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
