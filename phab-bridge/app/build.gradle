plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dsann.phonebridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dsann.phonebridge'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
}

// Kotlin compiler options belong in the Kotlin plugin's configuration.
// The previous top-level kotlinOptions{} block is not recognized by the
// Android Gradle plugin/Kotlin plugin combination used by this project.
kotlin {
    jvmToolchain(8)
}
