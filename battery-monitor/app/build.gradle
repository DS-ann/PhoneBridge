plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsann.batterymonitor'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dsann.batterymonitor'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
